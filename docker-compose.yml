services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: espectrografo_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: always

  mysql:
    image: mysql:8.4
    container_name: espectrografo_db
    env_file: ./docker/.env
    # 3306 is reachable only on the docker bridge network — never published
    # to the host.  Flask + mqtt_bridge connect via the service name `mysql`.
    expose:
      - "3306"
    # Tuned for the 512 MB DigitalOcean droplet that runs production.  The
    # default mysql:8.4 buffer pool is 128 MB and performance_schema reserves
    # ~400 MB of address space at startup, both of which OOM the box.  Raise
    # the limits later if you migrate to a larger host.
    command: >
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --max-connections=20
      --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.flask
    container_name: espectrografo_flask
    ports:
      - "5000:5000"
    env_file: ./docker/.env
    environment:
      MYSQL_HOST: mysql
      # MySQL 8 default ACL refuses root@<any-host>; we use the dedicated
      # account the mysql:8.4 image creates from MYSQL_USER/MYSQL_PASSWORD on
      # first init (privileges scoped to MYSQL_DATABASE).
      MYSQL_USER: espectrografo_user
    volumes:
      - ./server:/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mqtt_bridge:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.mqtt_bridge
    container_name: espectrografo_bridge
    env_file: ./docker/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: espectrografo_user
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: always

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
